name: CI

# Lint every PHP file and run the tests that can run without a live store.
#
# Test/Unit bootstraps from Magento's own dev/tests/unit/framework/bootstrap.php,
# so it can only run inside a Magento installation. Here: lint and a composer.json
# validation only.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        run: |
          find . -path ./dist -prune -o -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Build release artifact(s)
        run: bash scripts/package.sh dist
